# docker-compose.yml — sobe só a infraestrutura (Postgres + Redis) pra
# rodar o backend localmente com "./gradlew bootRun". A aplicação em si
# não está containerizada aqui de propósito, pra facilitar o dia a dia
# de desenvolvimento (debug direto na IDE).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metas
      POSTGRES_USER: metas
      POSTGRES_PASSWORD: metas
    ports:
      - "5432:5432"
    volumes:
      - metas_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  metas_postgres_data:
